name: CI/CD - Test, Deploy, and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  # ========================================================
  # 1. TEST JOB: Runs all unit tests
  # ========================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  # ========================================================
  # 2. BUILD AND DEPLOY JOB: Exports static HTML & deploys to Pages
  # ========================================================
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Swap Logout Route for Static Export
        run: |
          rm -f app/action/logout/route.tsx
          cat << 'EOF' > app/action/logout/page.tsx
          "use client";
          import { useEffect, Suspense } from "react";
          import { useRouter, useSearchParams } from "next/navigation";

          function LogoutContent() {
            const router = useRouter();
            const searchParams = useSearchParams();
            useEffect(() => {
              sessionStorage.clear();
              const reason = searchParams.get("r");
              const redirectUrl = reason ? `/login?r=${reason}` : "/login";
              router.push(redirectUrl);
            }, [router, searchParams]);
            return null;
          }

          export default function LogoutPage() {
            return (
              <Suspense fallback={null}>
                <LogoutContent />
              </Suspense>
            );
          }
          EOF

      - name: Build and Export Static HTML
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_API_URL: "https://simonev-api.campus.edu/api"
        run: npm run build

      - name: Upload Pages Deployment Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ========================================================
  # 3. RELEASE JOB: Bumps version, creates Git Tag, pushes Docker image
  # ========================================================
  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      IMAGE_NAME: adamilkom00/unpaksimonevv2_fe
    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # GET TAG
      # =========================
      - name: Get latest tag
        id: tag
        run: |
          latest=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            latest="v1.0.0"
          fi

          echo "LATEST=$latest" >> $GITHUB_OUTPUT

      # =========================
      # BUMP VERSION
      # =========================
      - name: Bump patch version
        id: version
        run: |
          tag=${{ steps.tag.outputs.LATEST }}
          version=${tag#v}

          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))

          new="v$major.$minor.$patch"

          echo "NEW_TAG=$new" >> $GITHUB_OUTPUT

      # =========================
      # CREATE TAG (SAFE)
      # =========================
      - name: Create Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${{ steps.version.outputs.NEW_TAG }}
          git push origin ${{ steps.version.outputs.NEW_TAG }}

      # =========================
      # DOCKER LOGIN (SAFE)
      # =========================
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # SETUP BUILDX
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # BUILD & PUSH (NO LEAK)
      # =========================
      - name: Build and Push Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false   # 🔥 cegah metadata leak
          sbom: false         # 🔥 cegah info dependency leak
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.NEW_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max