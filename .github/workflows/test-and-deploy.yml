name: CI/CD - Test and Deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ========================================================
  # TEST JOB: Runs all unit tests
  # ========================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  # ========================================================
  # BUILD AND DEPLOY JOB: Exports static HTML & deploys
  # ========================================================
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages Settings
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Swap Logout Route for Static Export
        run: |
          rm -f app/action/logout/route.tsx
          cat << 'EOF' > app/action/logout/page.tsx
          "use client";
          import { useEffect, Suspense } from "react";
          import { useRouter, useSearchParams } from "next/navigation";

          function LogoutContent() {
            const router = useRouter();
            const searchParams = useSearchParams();
            useEffect(() => {
              sessionStorage.clear();
              const reason = searchParams.get("r");
              const redirectUrl = reason ? `/login?r=${reason}` : "/login";
              router.push(redirectUrl);
            }, [router, searchParams]);
            return null;
          }

          export default function LogoutPage() {
            return (
              <Suspense fallback={null}>
                <LogoutContent />
              </Suspense>
            );
          }
          EOF

      - name: Build and Export Static HTML
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_API_URL: "https://simonev-api.campus.edu/api"
        run: npm run build

      - name: Upload Pages Deployment Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
